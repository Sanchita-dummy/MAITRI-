# MAITRI prototype - only Neo4j is containerized.
# Backend (FastAPI) and frontend (Vite) run directly on the host for a
# simple hackathon local-dev setup.
services:
  neo4j:
    image: neo4j:5.24-community
    container_name: maitri-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol (used by the backend)
    environment:
      - NEO4J_AUTH=neo4j/maitri_password
      - NEO4J_PLUGINS=[]
    volumes:
      - maitri_neo4j_data:/data
      - maitri_neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  maitri_neo4j_data:
  maitri_neo4j_logs:
